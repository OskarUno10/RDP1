name: Validate and package Windows relay panel
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  panel:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: relay-panel
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Real TCP relay, expiry, persistence and API security tests
        run: python -m unittest discover -s tests -v
      - name: Build Windows application
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --clean --noconfirm --onefile --name RdpFreeRelay --add-data "panel.html;." relay_panel.py
      - name: Smoke test packaged executable (no RDP connection)
        shell: python
        run: |
          import subprocess,time,urllib.request,tempfile,pathlib
          with tempfile.TemporaryDirectory() as folder:
              p=subprocess.Popen(['dist/RdpFreeRelay.exe','--no-browser','--port','18877','--data',str(pathlib.Path(folder)/'sessions.json')],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              try:
                  for _ in range(40):
                      if p.poll() is not None: raise RuntimeError('Packaged application exited unexpectedly')
                      try:
                          with urllib.request.urlopen('http://127.0.0.1:18877/',timeout=1) as r:
                              assert r.status==200 and b'RdpFree' in r.read()
                          print('Packaged Windows application served its local panel successfully.')
                          break
                      except OSError: time.sleep(.5)
                  else: raise RuntimeError('Packaged application did not start')
              finally:
                  p.terminate();p.wait(timeout=10)
      - name: Package readme and checksum
        shell: pwsh
        run: |
          Copy-Item README.md dist/README.md
          Copy-Item Start-Relay-Panel.cmd dist/Start-Relay-Panel.cmd
          (Get-FileHash dist/RdpFreeRelay.exe -Algorithm SHA256).Hash | Set-Content dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RdpFree-Relay-Windows
          path: relay-panel/dist/*
          retention-days: 14
